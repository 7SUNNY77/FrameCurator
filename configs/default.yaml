# Базовый конфиг FrameCurator. Все параметры экспериментов — здесь или в configs/experiments/*.yaml.
seed: 0

# Этап 0.2, раздел 7.5: симуляция мощности слепой оценки H1
power:
  n_videos: [15, 20, 25, 30]
  n_raters: [3, 5, 7]
  p_true: [0.60, 0.65, 0.70]
  sd_video: 0.15
  n_sim: 2000
  n_boot: 2000
  # min_point 0.60 — порог по умолчанию из 9.2; 0.55 — запасной вариант из 7.5
  min_point: [0.60, 0.55]
  # 0.05 — CI без поправки (как в 7.5); 0.05/3 — самый строгий шаг Холма для 3 гипотез
  alpha: [0.05, 0.016666666666666666]

# Раздел 6.4 (значения фиксируются на этапе 1.1)
candidates:
  fps_sample: 2
  max_candidates: 300
  long_side_px: 512
  jpeg_quality: 92

# Раздел 7.2
pools:
  pool_size: 32
  target_pairs: 64
